<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITSMate | Signed Out</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f7;
      --panel: rgba(255, 255, 255, 0.88);
      --text: #102033;
      --muted: #5c6b7c;
      --brand: #0f766e;
      --brand-2: #0ea5a2;
      --line: rgba(16, 32, 51, 0.08);
      --shadow: 0 18px 42px rgba(15, 23, 42, 0.10);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(14, 165, 162, 0.18), transparent 24%),
        linear-gradient(180deg, #f7fbfc, var(--bg));
    }

    .card {
      width: min(100%, 420px);
      padding: 32px;
      border-radius: 28px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      text-align: center;
    }

    a {
      color: var(--brand);
      text-decoration: none;
      font-weight: 700;
    }

    .btn {
      display: inline-flex;
      margin-top: 18px;
      height: 46px;
      padding: 0 18px;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>You are signed out</h1>
    <p>Your session has ended. Sign back in with your ServiceNow username and password.</p>
    <a class="btn" href="{% url 'accounts-login' %}">Sign in again</a>
  </main>
</body>
</html>
