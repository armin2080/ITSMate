{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Submit Feedback</title>
    <style>
      body { font-family: Inter, Arial, sans-serif; background: #f6fafb; color: #0f172a; margin: 0; padding: 24px; }
      .container { max-width: 700px; margin: 28px auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 8px 20px rgba(15,23,42,0.06); }
      h1 { margin: 0 0 8px; font-size: 1.2rem; }
      p.lead { margin: 0 0 16px; color: #52627a; }
      label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.88rem; }
      input[type=text], input[type=email], textarea { width: 100%; padding: 10px 12px; border: 1px solid #d7e3ea; border-radius: 10px; background: #f8fbfc; font: inherit; }
      textarea { min-height: 120px; resize: vertical; }
      .row { display: grid; gap: 12px; margin-bottom: 12px; }
      .actions { display:flex; gap: 10px; align-items: center; }
      .btn { background: linear-gradient(135deg,#0f766e,#0ea5a2); color: #fff; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 700; cursor: pointer; }
      .btn.alt { background: #eef4f7; color: #0f172a; border: 1px solid #d7e3ea; }
      .message { padding: 10px 12px; border-radius: 10px; }
      .success { background: #ecfdf5; border: 1px solid #bbf7d0; color: #065f46; }
      .error { background: #fff1f2; border: 1px solid #fecaca; color: #9f1239; }
      .hint { color: #70839b; font-size: 0.9rem; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Project feedback</h1>
      <p class="lead">We appreciate your feedback. Please use the form below to tell us what's working and what could be better.</p>

      <div id="feedback-message" class="message" style="display:none"></div>

      <form id="feedback-form" method="post">
        {% csrf_token %}
        <div class="row">
          <label for="id_name">Your name (optional)</label>
          <input id="id_name" name="name" type="text" placeholder="Jane Doe">
        </div>

        <div class="row">
          <label for="id_email">Email (optional)</label>
          <input id="id_email" name="email" type="email" placeholder="you@example.com">
        </div>

        <div class="row">
          <label for="id_message">Feedback</label>
          <textarea id="id_message" name="message" placeholder="What did you try? What did you expect? How can we improve?" required></textarea>
        </div>

        <div class="actions">
          <button type="submit" class="btn">Send feedback</button>
          <a href="/" class="btn alt" role="button">Return home</a>
        </div>
      </form>
    </div>

    <script>
      function getCookie(name) {
        const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
        return v ? v.pop() : '';
      }

      const form = document.getElementById('feedback-form');
      const msg = document.getElementById('feedback-message');

      form.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        msg.style.display = 'none';
        const data = new FormData(form);
        try {
          const resp = await fetch(window.location.pathname, {
            method: 'POST',
            headers: {
              'X-Requested-With': 'XMLHttpRequest',
              'X-CSRFToken': getCookie('csrftoken')
            },
            body: data
          });
          const payload = await resp.json();
          if (resp.ok) {
            msg.className = 'message success';
            msg.textContent = payload.message || 'Thanks — your feedback has been received.';
            msg.style.display = 'block';
            form.reset();
          } else {
            msg.className = 'message error';
            msg.textContent = payload.errors ? JSON.stringify(payload.errors) : (payload.message || 'Failed to submit feedback.');
            msg.style.display = 'block';
          }
        } catch (error) {
          msg.className = 'message error';
          msg.textContent = error.message || 'Network error while submitting feedback.';
          msg.style.display = 'block';
        }
      });
    </script>
  </body>
</html>
